<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toronto-Leitfaden 2026–2027</title>
  <meta name="description" content="Toronto-Leitfaden: Aktivitäten, Communitys & berufliche Netzwerke (September 2026 – März 2027).">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ================= Eingangs-/Heldensektion =================
       Logo + Titel + Zeitraum; befüllt durch renderHero() in js/main.js -->
  <header id="hero" class="hero"></header>

  <main class="container">

    <!-- ================= Kurzfassung (Kasten oben) =================
         Befüllt durch renderKurzfassung() -->
    <section id="kurzfassung" class="box box--highlight"></section>

    <!-- ================= Themen-Übersicht (große Sprung-Karten) =========
         Jede Karte verlinkt auf eine EIGENE Seite (z. B. klimapolitik.html).
         Suchfeld filtert die Karten; Karten kommen aus renderCards() -->
    <nav class="nav" aria-label="Themenübersicht">
      <h2 class="nav__title">Themen</h2>
      <div class="nav__search">
        <label for="search" class="visually-hidden">Nach Interessensgebiet suchen</label>
        <input
          id="search"
          type="search"
          placeholder="Nach Interessensgebiet suchen … (z. B. Klima, Kinder, Feminismus)"
          autocomplete="off">
        <span id="search-count" class="nav__count" aria-live="polite"></span>
      </div>
      <div id="nav-cards" class="card-grid"></div>
    </nav>

  </main>

  <footer class="site-footer">
    <p>Toronto-Leitfaden · September 2026 – März 2027 · <a href="../">Zur Startseite</a></p>
  </footer>

  <!-- Daten zuerst, dann der Renderer der Startseite -->
  <script src="data/sections.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
