<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Für Anna</title>
  <style>
    /* Self-contained Platzhalterseite — wird später mit Inhalt gefüllt. */
    :root { --accent:#b4532a; --accent-deep:#8c3d1d; --bg:#fbf7f0; --ink:#2e2a25; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font-family:"Georgia","Palatino",serif; line-height:1.6;
    }
    .hero {
      background:linear-gradient(135deg,var(--accent),var(--accent-deep));
      color:#fff; text-align:center; padding:60px 20px;
    }
    .hero h1 { margin:0 0 10px; font-size:2.2rem; }
    .hero p { margin:0; font-style:italic; opacity:.95; }
    main { max-width:640px; margin:0 auto; padding:36px 20px; }
    .back { display:inline-block; margin-bottom:20px; color:var(--accent-deep); }
    code { background:#f3e3d8; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Für Anna ❤️</h1>
    <p>Eine Seite nur für dich.</p>
  </header>
  <main>
    <a class="back" href="../">← Startseite</a>
    <h2>Kommt bald</h2>
    <p>Diese Seite ist angelegt und erreichbar unter
      <code>tschnake.github.io/anna/</code>. Gib mir den Inhalt, den du hier
      haben möchtest, und ich fülle ihn ein.</p>
  </main>
</body>
</html>
